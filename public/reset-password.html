<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%234f46e5%27/%3E%3C/svg%3E" />
<title>Reset your password — Docklio</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="topbar">
  <a href="/" class="brand"><span class="dot"></span> Docklio</a>
</div>

<div class="wrap" style="max-width:420px;">
  <h1>Reset your password</h1>
  <p class="subtitle">Choose a new password for your account.</p>

  <div id="msg" class="msg hidden"></div>

  <form id="resetForm" class="card">
    <div class="field">
      <label for="password">New password</label>
      <input type="password" id="password" required autocomplete="new-password" minlength="8" />
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="8" />
    </div>
    <div class="actions">
      <button type="submit" class="primary" id="resetBtn">Reset password</button>
    </div>
  </form>

  <p style="text-align:center; font-size:14px; color:var(--muted); margin-top:20px;">
    <a href="login.html" style="color:var(--brand);">Back to log in</a>
  </p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token') || '';

const form = document.getElementById('resetForm');
const msg = document.getElementById('msg');
const btn = document.getElementById('resetBtn');

if (!token) {
  msg.className = 'msg err';
  msg.textContent = 'This reset link is invalid or missing a token. Please request a new one.';
  form.querySelectorAll('input, button').forEach((el) => (el.disabled = true));
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg hidden';

  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  if (password !== confirmPassword) {
    msg.className = 'msg err';
    msg.textContent = 'Passwords do not match.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Resetting...';

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong');

    msg.className = 'msg ok';
    msg.textContent = 'Your password has been reset. Redirecting to log in...';
    form.reset();
    setTimeout(() => (window.location.href = 'login.html'), 1800);
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = err.message;
    btn.disabled = false;
    btn.textContent = 'Reset password';
  }
});
</script>

</body>
</html>
