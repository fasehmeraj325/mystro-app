<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%234f46e5%27/%3E%3C/svg%3E" />
<title>Forgot password — Docklio</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="topbar">
  <a href="/" class="brand"><span class="dot"></span> Docklio</a>
</div>

<div class="wrap" style="max-width:420px;">
  <h1>Forgot your password?</h1>
  <p class="subtitle">Enter your account email and we'll send you a reset link.</p>

  <div id="msg" class="msg hidden"></div>

  <form id="forgotForm" class="card">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username" />
    </div>
    <div class="actions">
      <button type="submit" class="primary" id="sendBtn">Send reset link</button>
    </div>
  </form>

  <p style="text-align:center; font-size:14px; color:var(--muted); margin-top:20px;">
    <a href="login.html" style="color:var(--brand);">Back to log in</a>
  </p>
</div>

<script>
const form = document.getElementById('forgotForm');
const msg = document.getElementById('msg');
const btn = document.getElementById('sendBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg hidden';
  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value }),
    });
    if (!res.ok) throw new Error('Something went wrong. Please try again.');

    msg.className = 'msg ok';
    msg.textContent = "If that email has an account, we've sent a link to reset your password.";
    form.reset();
    btn.textContent = 'Send reset link';
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = err.message;
    btn.disabled = false;
    btn.textContent = 'Send reset link';
  }
});
</script>

</body>
</html>
